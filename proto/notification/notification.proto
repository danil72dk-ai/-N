syntax = "proto3";

package messenger.notification.v1;

option go_package = "github.com/example/messenger/proto/notification/v1;notificationv1";

import "proto/common/types.proto";

service NotificationService {
  rpc SendPush(SendPushRequest) returns (SendPushResponse);
}

message SendPushRequest {
  int64 user_id = 1;
  int64 chat_id = 2;
  string title = 3;
  string body = 4;
  map<string, string> data = 5;
}

message SendPushResponse {
  bool success = 1;
}
