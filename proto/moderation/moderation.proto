syntax = "proto3";

package messenger.moderation.v1;

option go_package = "github.com/example/messenger/proto/moderation/v1;moderationv1";

import "proto/common/types.proto";

service ModerationService {
  rpc ReportMessage(ReportMessageRequest) returns (ReportMessageResponse);
  rpc ApplyAction(ApplyActionRequest) returns (ApplyActionResponse);
}

message ReportMessageRequest {
  int64 reporter_user_id = 1;
  int64 chat_id = 2;
  string server_msg_id = 3;
  string reason = 4;
}

message ReportMessageResponse {
  string case_id = 1;
}

message ApplyActionRequest {
  string case_id = 1;
  int64 target_user_id = 2;
  string action = 3;
  string reason = 4;
}

message ApplyActionResponse {
  bool success = 1;
}
