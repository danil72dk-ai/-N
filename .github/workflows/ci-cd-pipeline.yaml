name: CI-CD Pipeline

on:
  pull_request:
  push:
    branches: ["main", "work"]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protobuf
        run: |
          buf lint

      - name: Validate SQL/CQL presence
        run: |
          test -f db/postgres/001_init.sql
          test -f db/cassandra/schema.cql

  build-images:
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    strategy:
      matrix:
        service: [gateway, auth, chat, message, media, notification, bot, moderation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build service image (placeholder)
        run: |
          echo "Build docker image for ${{ matrix.service }}"

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-images]
    environment: staging
    steps:
      - name: Deploy placeholder
        run: |
          echo "Deploy to staging via Helm/ArgoCD here"
